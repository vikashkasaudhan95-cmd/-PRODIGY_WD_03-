<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe Web Application</title>
  <link rel="stylesheet" href="3.css">
</head>
<body>

  <div class="container">
    <h1>Tic-Tac-Toe</h1>
    
    <!-- Mode Selection -->
    <div class="mode-selector">
      <button id="pvpMode" class="mode-btn active">Player vs Player</button>
      <button id="aiMode" class="mode-btn">Player vs AI</button>
    </div>

    <!-- Game Status -->
    <div id="status" class="status">Player X's Turn</div>

    <!-- 3x3 Game Grid -->
    <div id="board" class="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>

    <!-- Control Button -->
    <button id="resetBtn" class="reset-btn">Restart Game</button>
  </div>

  <script src="3.js"></script>
</body>
</html>
